[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["course_index"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  'pragma: no cover',
  'if.*?__name__.*?==.*?.__main__.:',
]

[tool.setuptools.dynamic]
version = {attr = "course_index.__info__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
course_index = ["VERSION.txt", "skeleton.idx", "template/*", "template/lib/*", "tui/*.tcss"]

[project]
name = "course-index"
authors = [
  {name="Alexandre D'Hondt", email="alexandre.dhondt@gmail.com"},
]
description = "GUI and TUI for editing the index of the LaTeX course index template and compiling it to PDF"
license = {file = "LICENSE"}
keywords = ["latex", "makeindex", "index", "course-index", "gui", "qt", "tui", "textual", "sans", "giac"]
requires-python = ">=3.10,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "PySide6-Essentials>=6.6",
  "rich>=13",
  "textual>=1.0",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
documentation = "https://course-index.readthedocs.io/en/latest/?badge=latest"
homepage = "https://github.com/academic-templates/course-index"
issues = "https://github.com/academic-templates/course-index/issues"
repository = "https://github.com/academic-templates/course-index"

[project.scripts]
course-index = "course_index.__main__:main"
