site_author: dhondta
site_name: Course Index
site_description: GUI and TUI for editing the index of the LaTeX course index template and compiling it to PDF
site_url: https://course-index.readthedocs.io
repo_url: https://github.com/academic-templates/course-index
edit_uri: edit/main/docs/pages/
copyright: Copyright &copy; 2026 Alexandre D'Hondt
docs_dir: pages
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Command line: cli/course-index.md
  - The .idx format: format.md
  - Python API: api.md
  - How it works: internals.md
  - Contributing: contributing.md
extra:
  generator: false
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:alexandre.dhondt@gmail.com
      name: Contact Alex
    - icon: fontawesome/brands/github
      link: https://github.com/dhondta
      name: Alex on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/alexandre-d-2ab2aa14/
      name: Alex on LinkedIn
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/alex_dhondt
      name: Alex on Twitter
theme:
  name: material
  logo: img/logo.png
  favicon: img/icon.png
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - toc.follow
use_directory_urls: false
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
